  <path d="M244 145 L256 145 L258 150 L242 150 Z" fill="#e87c3e" opacity="0.5"/>
  <!-- Tools in hand -->
  <rect x="260" y="180" width="20" height="3" rx="1" fill="#7a7a8a" opacity="0.5"/>
  <!-- Years badge -->
  <circle cx="350" cy="90" r="25" fill="#1a3a5c" stroke="#1a3a5c" stroke-width="1.5" opacity="0.3"/>
  <text x="350" y="87" text-anchor="middle" font-size="10" fill="#1a3a5c" font-weight="bold">Est.</text>
  <text x="350" y="100" text-anchor="middle" font-size="11" fill="#1a3a5c" font-weight="bold">2011</text>
