<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Office/depot building -->
  <rect x="50" y="120" width="160" height="120" rx="4" fill="#f4f5f7" stroke="#c8c8d0" stroke-width="1"/>
  <rect x="60" y="130" width="30" height="25" rx="2" fill="#3a8fb7" opacity="0.15"/>
  <rect x="100" y="130" width="30" height="25" rx="2" fill="#3a8fb7" opacity="0.15"/>
  <rect x="140" y="130" width="30" height="25" rx="2" fill="#3a8fb7" opacity="0.15"/>
  <rect x="60" y="165" width="30" height="25" rx="2" fill="#3a8fb7" opacity="0.15"/>
  <rect x="100" y="165" width="30" height="25" rx="2" fill="#3a8fb7" opacity="0.15"/>
  <rect x="140" y="165" width="30" height="25" rx="2" fill="#3a8fb7" opacity="0.15"/>
  <!-- Door -->
  <rect x="105" y="205" width="30" height="35" rx="2" fill="#1a3a5c" opacity="0.3"/>
