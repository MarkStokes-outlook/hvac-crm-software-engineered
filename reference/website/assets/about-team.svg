  <!-- Team of people -->
  <circle cx="250" cy="155" r="12" fill="#e87c3e" opacity="0.7"/>
  <rect x="243" y="169" width="14" height="28" rx="4" fill="#1a3a5c" opacity="0.5"/>
  <circle cx="280" cy="160" r="10" fill="#e87c3e" opacity="0.6"/>
  <rect x="274" y="172" width="12" height="24" rx="4" fill="#1a3a5c" opacity="0.4"/>
  <circle cx="310" cy="155" r="12" fill="#e87c3e" opacity="0.7"/>
  <rect x="303" y="169" width="14" height="28" rx="4" fill="#1a3a5c" opacity="0.5"/>
  <circle cx="340" cy="162" r="10" fill="#e87c3e" opacity="0.6"/>
  <rect x="334" y="174" width="12" height="24" rx="4" fill="#1a3a5c" opacity="0.4"/>
